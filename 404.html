<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Page Not Found - City Metro</title>
  <meta name="description" content="Page not found - City Metro" />

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#0ea5e9" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #111;
      background-color: #fff;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    a:focus-visible {
      outline: 2px solid #0066cc;
      outline-offset: 3px;
      border-radius: 4px;
    }

    header,
    main,
    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Top Bar */
    [data-section="top-bar"] {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.25rem;
      padding-bottom: 0.5rem;
    }

    [data-slot="back-link"] {
      font-size: 0.875rem;
      text-decoration: none;
      color: #555;
    }

    [data-slot="back-link"]:hover {
      text-decoration: underline;
    }

    /* Content */
    main {
      padding: 4rem 1.25rem 5rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin: 0 0 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      margin: 0 0 2rem;
    }

    .home-button {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      background-color: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .home-button:hover {
      background-color: #333;
      text-decoration: none;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 2rem;
      padding-bottom: 2.5rem;
      border-top: 1px solid #e5e5e5;
      font-size: 0.875rem;
      color: #555;
    }

    footer nav {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    footer p[data-field="copyright"] {
      margin: 0;
    }

    /* Clean Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e5e5e5;
      }

      p,
      footer,
      [data-slot="back-link"] {
        color: #a0a0a0;
      }

      .home-button {
        background-color: #f5f5f5;
        color: #111;
      }

      .home-button:hover {
        background-color: #e0e0e0;
      }

      footer {
        border-color: #2a2a2a;
      }

      a:focus-visible {
        outline-color: #4da3ff;
      }
    }
  </style>
</head>
<body>
  <header data-section="top-bar">
    <a href="index.html" data-slot="back-link">&larr; City Metro</a>
  </header>

  <main role="main">
    <h1>404</h1>
    <p>The page you are looking for could not be found.</p>
    <a href="index.html" class="home-button">Return to Homepage</a>
  </main>

  <footer data-section="footer">
    <nav data-slot="footer-nav">
      <a href="index.html" data-field="footer-link">Home</a>
      <a href="privacy-policy/index.html" data-field="footer-link">Privacy Policy</a>
      <a href="mailto:support@citymetro.app" data-field="footer-link">Support</a>
    </nav>
    <p data-field="copyright">&copy; City Metro. All rights reserved.</p>
  </footer>
</body>
</html>
